name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          # Find previous tag for changelog compare link
          PREV_TAG=$(git tag --sort=-v:refname | grep -A1 "^${GITHUB_REF#refs/tags/}$" | tail -1)
          if [ "$PREV_TAG" = "${GITHUB_REF#refs/tags/}" ]; then
            PREV_TAG=$(git tag --sort=-v:refname | head -2 | tail -1)
          fi
          echo "PREV_TAG=${PREV_TAG}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          # Strip 'v' prefix for CHANGELOG matching (tag: v0.1.1 → changelog: 0.1.1)
          VER_NUM="${VERSION#v}"
          # Extract section between this version header and the next ## heading
          NOTES=$(sed -n "/^## ${VER_NUM}/,/^## /{/^## ${VER_NUM}/!{/^## /!p}}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            # Fallback: try with brackets format ## [0.1.1]
            NOTES=$(sed -n "/^## \[${VER_NUM}\]/,/^## /{/^## \[${VER_NUM}\]/!{/^## /!p}}" CHANGELOG.md)
          fi
          if [ -z "$NOTES" ]; then
            NOTES="- See CHANGELOG.md for details."
          fi
          # Remove blank lines at start/end
          NOTES=$(echo "$NOTES" | sed '/./,$!d' | sed -e :a -e '/^\n*$/{ $d; N; ba; }')
          # Categorize items into Added / Changed / Fixed
          ADDED=$(echo "$NOTES" | grep -i '^- Added' || true)
          UPDATED=$(echo "$NOTES" | grep -iE '^- (Updated|Reworked|Preserved)' || true)
          OTHER=$(echo "$NOTES" | grep -ivE '^- (Added|Updated|Reworked|Preserved)' || true)
          # Build release body
          BODY="## OpenArc ${VERSION}\n\n"
          if [ -n "$ADDED" ]; then
            BODY+="### 🆕 Added\n${ADDED}\n\n"
          fi
          if [ -n "$UPDATED" ]; then
            BODY+="### 🔧 Changed\n${UPDATED}\n\n"
          fi
          if [ -n "$OTHER" ]; then
            BODY+="### 📋 Other\n${OTHER}\n\n"
          fi
          BODY+="---\n**Full Changelog:** https://github.com/${{ github.repository }}/compare/${{ steps.version.outputs.PREV_TAG }}...${VERSION}"
          echo -e "$BODY" > /tmp/release_notes.md
          cat /tmp/release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "OpenArc ${{ steps.version.outputs.VERSION }}"
          body_path: /tmp/release_notes.md
          generate_release_notes: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
